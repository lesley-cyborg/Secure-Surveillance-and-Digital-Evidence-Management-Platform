[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secure-surveillance-ai-engine"
version = "0.1.0"
description = "Model-independent AI detection engine for the secure surveillance platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1.0",
    "numpy>=2.2,<3.0",
    "opencv-python-headless>=4.11,<5.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pytesseract>=0.3.13,<1.0",
    "python-multipart>=0.0.20,<1.0",
    "structlog>=25.4,<26.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<8.0",
    "ruff>=0.12,<1.0",  
]
model = [
    "ultralytics>=8.4.105",
]

[tool.hatch.build.targets.wheel]
packages = [
    "api",
    "config",
    "detection",
    "models",
    "streaming",
    "vision",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RUF",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "config",
    "detection",
    "models",
    "streaming",
    ]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "cv2"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests across multiple components",
    "rtsp: requires the Docker synthetic RTSP test stack",
]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
branch = true
source = [
    "api",
    "config",
    "detection",
    "streaming",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85