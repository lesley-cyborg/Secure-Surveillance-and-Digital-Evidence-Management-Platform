[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secure-surveillance-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-powered secure surveillance and digital evidence platform."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0,<2.2",
  "alembic>=1.18,<2.0",
  "asyncpg>=0.30,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "redis[hiredis]>=5.2,<7.0",
  "python-json-logger>=3.2,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "pyjwt[crypto]>=2.10,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "minio>=7.2.20",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.25,<2.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
  "mypy>=1.14,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires the PostgreSQL integration-test database",
]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/modules/rbac/access_types.py" = ["UP040"]
"app/modules/users/dependencies.py" = ["UP040"]

# FastAPI dependency aliases intentionally use Annotated + TypeAlias.
# PEP 695 aliases can behave differently at runtime.
"app/modules/auth/dependencies.py" = ["UP040"]
"app/modules/rbac/dependencies.py" = ["UP040"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions"]


[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
