services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: surveillance
      POSTGRES_USER: surveillance
      POSTGRES_PASSWORD: surveillance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance -d surveillance"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/evidence
        mc version enable local/evidence
        mc anonymous set none local/evidence

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      # These override the .env file specifically for the Docker container network
      DATABASE_URL: postgresql+asyncpg://surveillance:surveillance@postgres:5432/surveillance
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: evidence
      CAMERA_STREAM_ENCRYPTION_KEY: zqkB-GMg0t0RZbQd66NH_c_5T_CrxN0uCtdGrfPYFwo=
      
      # THIS WAS THE MISSING PIECE causing the Pydantic crash:
      JWT_SECRET_KEY: "nfLtlq5ZbcLBwJYajwbReNwDRWcW6kChjkMaCBiNyLu3Us3J6MpgANXjLeN0eMY3fWDFKuIBV44L2DUg"
      
      # AI Ingestion settings for the container
      AI_INGESTION_ENABLED: "true"
      AI_INGESTION_SERVICE_TOKEN: "dev-ai-service-token-change-me"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
