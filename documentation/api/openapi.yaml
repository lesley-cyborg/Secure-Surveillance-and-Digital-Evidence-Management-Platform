openapi: 3.1.2
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Secure Surveillance Platform API
  version: 1.0.0
  summary: REST API for AI-powered surveillance and forensic evidence management.
  description: 'Production-oriented contract for authentication and RBAC, camera management, AI-generated incidents, encrypted
    digital evidence, evidence integrity verification, chain of custody, reporting, notifications, and immutable auditing.


    All timestamps use RFC 3339 UTC. Protected operations require a JWT bearer access token. The custom `x-rbac-permissions`
    and `x-audit` extensions document authorization and audit behavior.'
  contact:
    name: Secure Surveillance Platform Team
  license:
    name: Proprietary
servers:
- url: https://api.example.com
  description: Production
- url: https://staging-api.example.com
  description: Staging
- url: http://localhost:8000
  description: Local development
tags:
- name: Authentication
  description: Authentication, MFA, token rotation, logout, and current-user operations.
- name: Users
  description: User lifecycle and role-based access control.
- name: Cameras
  description: Camera registration, health checks, and AI configuration.
- name: Incidents
  description: Incident creation, triage, assignment, investigation, and closure.
- name: Evidence
  description: Secure evidence ingestion, retrieval, export, verification, and quarantine.
- name: Chain of Custody
  description: Append-only evidence custody events and transfers.
- name: Reports
  description: Forensic, operational, audit, and analytics reports.
- name: Notifications
  description: User notifications and read state.
- name: Audit
  description: Authorized access to immutable audit records.
security:
- bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Authenticate a user
      description: Validates credentials, applies throttling and lockout rules, and returns tokens or an MFA challenge.
      operationId: loginUser
      x-rbac-permissions: []
      x-audit:
        event: AUTH_LOGIN_ATTEMPT
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
      responses:
        '200':
          description: Authentication succeeded.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '202':
          description: Primary credentials are valid and MFA verification is required.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaChallengeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      x-rate-limit-policy: auth-login
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - Authentication
      summary: Verify an MFA challenge
      description: Available to authenticated users unless otherwise stated.
      operationId: verifyMfaChallenge
      x-rbac-permissions: []
      x-audit:
        event: AUTH_MFA_VERIFY
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
      responses:
        '200':
          description: MFA verification succeeded.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      x-rate-limit-policy: auth-mfa
  /api/v1/auth/refresh:
    post:
      tags:
      - Authentication
      summary: Rotate a refresh token
      description: Validates the refresh token, detects reuse, rotates the token family, and returns a new token pair.
      operationId: refreshAccessToken
      x-rbac-permissions: []
      x-audit:
        event: AUTH_TOKEN_REFRESH
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
      responses:
        '200':
          description: Refresh token rotated successfully.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      x-idempotent: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      x-rate-limit-policy: auth-refresh
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: Log out the current user
      description: Available to authenticated users unless otherwise stated.
      operationId: logoutUser
      x-rbac-permissions: []
      x-audit:
        event: AUTH_LOGOUT
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
      responses:
        '204':
          description: Session revoked successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get the current authenticated user
      description: Available to authenticated users unless otherwise stated.
      operationId: getCurrentUser
      x-rbac-permissions: []
      x-audit:
        event: AUTH_ME_VIEW
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '200':
          description: Current user profile and effective permissions.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List users
      description: Requires RBAC permission `users.read`.
      operationId: listUsers
      x-rbac-permissions:
      - users.read
      x-audit:
        event: USER_LIST_VIEW
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '200':
          description: Paginated user list.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - &id001
        $ref: '#/components/parameters/Page'
      - &id002
        $ref: '#/components/parameters/PageSize'
      - &id003
        $ref: '#/components/parameters/Search'
      - &id004
        $ref: '#/components/parameters/Sort'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: roleId
        in: query
        required: false
        schema:
          type: string
          format: uuid
    post:
      tags:
      - Users
      summary: Create a user
      description: Requires RBAC permission `users.create`.
      operationId: createUser
      x-rbac-permissions:
      - users.create
      x-audit:
        event: USER_CREATED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '201':
          description: User created.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-idempotent: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
  /api/v1/users/{userId}:
    get:
      tags:
      - Users
      summary: Get a user
      description: Requires RBAC permission `users.read`.
      operationId: getUser
      x-rbac-permissions:
      - users.read
      x-audit:
        event: USER_VIEWED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '200':
          description: User details.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Users
      summary: Update a user
      description: Requires RBAC permission `users.update`.
      operationId: updateUser
      x-rbac-permissions:
      - users.update
      x-audit:
        event: USER_UPDATED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '200':
          description: User updated.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
  /api/v1/users/{userId}/roles:
    post:
      tags:
      - Users
      summary: Assign a role to a user
      description: Requires RBAC permission `users.roles.assign`.
      operationId: assignUserRole
      x-rbac-permissions:
      - users.roles.assign
      x-audit:
        event: USER_ROLE_ASSIGNED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '201':
          description: Role assigned.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-idempotent: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
  /api/v1/users/{userId}/roles/{roleId}:
    delete:
      tags:
      - Users
      summary: Remove a role from a user
      description: Requires RBAC permission `users.roles.remove`.
      operationId: removeUserRole
      x-rbac-permissions:
      - users.roles.remove
      x-audit:
        event: USER_ROLE_REMOVED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '204':
          description: Role removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/RoleId'
  /api/v1/users/{userId}/deactivate:
    post:
      tags:
      - Users
      summary: Deactivate a user
      description: Requires RBAC permission `users.deactivate`.
      operationId: deactivateUser
      x-rbac-permissions:
      - users.deactivate
      x-audit:
        event: USER_DEACTIVATED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '200':
          description: User deactivated and sessions revoked.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      x-idempotent: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateUserRequest'
  /api/v1/users/{userId}/credential-reset:
    post:
      tags:
      - Users
      summary: Initiate a credential reset
      description: Requires RBAC permission `users.credentials.reset`.
      operationId: initiateUserCredentialReset
      x-rbac-permissions:
      - users.credentials.reset
      x-audit:
        event: USER_CREDENTIAL_RESET_INITIATED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: user
      responses:
        '202':
          description: Credential-reset workflow accepted.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security:
      - bearerAuth: []
      x-idempotent: true
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialResetRequest'
  /api/v1/cameras:
    get:
      tags:
      - Cameras
      summary: List cameras
      description: Requires RBAC permission `cameras.read`.
      operationId: listCameras
      x-rbac-permissions:
      - cameras.read
      x-audit:
        event: CAMERA_LIST_VIEW
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: camera
      responses:
        '200':
          description: Paginated camera list.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      - *id002
      - *id003
      - *id004
      - name: siteId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CameraStatus'
    post:
      tags:
      - Cameras
      summary: Register a camera
      description: Requires RBAC permission `cameras.create`.
      operationId: registerCamera
      x-rbac-permissions:
      - cameras.create
      x-audit:
        event: CAMERA_REGISTERED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: camera
      responses:
        '201':
          description: Camera registered.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
