      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportExportRequest'
  /api/v1/notifications:
    get:
      tags:
      - Notifications
      summary: List current-user notifications
      description: Requires RBAC permission `notifications.read`.
      operationId: listNotifications
      x-rbac-permissions:
      - notifications.read
      x-audit:
        event: NOTIFICATION_LIST_VIEW
        recordOn:
        - success
