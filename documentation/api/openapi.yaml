      operationId: markNotificationRead
      x-rbac-permissions:
      - notifications.read
      x-audit:
        event: NOTIFICATION_MARKED_READ
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: notification
      responses:
        '200':
          description: Notification marked as read.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/NotificationId'
  /api/v1/audit-logs:
    get:
      tags:
      - Audit
      summary: Search audit logs
      description: Requires RBAC permission `audit.read`.
      operationId: listAuditLogs
      x-rbac-permissions:
      - audit.read
      x-audit:
        event: AUDIT_LOG_SEARCHED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: audit_log
      responses:
        '200':
          description: Paginated audit-log results.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - *id001
      - *id002
      - *id003
      - *id004
      - name: actorUserId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: resourceType
        in: query
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: outcome
        in: query
        required: false
        schema:
          type: string
          enum:
          - SUCCESS
          - FAILURE
          - DENIED
      - name: occurredFrom
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: occurredTo
        in: query
        required: false
        schema:
          type: string
          format: date-time
  /api/v1/audit-logs/{auditLogId}:
    get:
      tags:
      - Audit
      summary: Get an audit-log record
      description: Requires RBAC permission `audit.read`.
      operationId: getAuditLog
      x-rbac-permissions:
      - audit.read
      x-audit:
        event: AUDIT_LOG_VIEWED
        recordOn:
        - success
        - failure
        captures:
        - actorId
        - sourceIp
        - userAgent
        - correlationId
        - outcome
        - resourceId
        resource: audit_log
      responses:
        '200':
          description: Audit-log record.
          headers:
            X-Correlation-ID:
              description: Correlation identifier for tracing this request.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/AuditLogId'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token issued by the authentication service.
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional client-supplied UUID used for distributed tracing. The server generates one when omitted.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key preventing duplicate execution of a sensitive write operation. Reusing a key with a different
        payload returns 409.
      schema:
        type: string
        minLength: 16
        maxLength: 255
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of records returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: search
      in: query
      required: false
      description: Free-text search term.
      schema:
        type: string
        maxLength: 200
    Sort:
      name: sort
      in: query
      required: false
      description: Comma-separated sort fields. Prefix descending fields with `-`.
      schema:
        type: string
        example: -createdAt,name
    UserId:
      name: userId
      in: path
      required: true
      description: User identifier.
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      description: Role identifier.
      schema:
        type: string
        format: uuid
    CameraId:
      name: cameraId
      in: path
      required: true
      description: Camera identifier.
      schema:
        type: string
        format: uuid
    IncidentId:
      name: incidentId
      in: path
      required: true
      description: Incident identifier.
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      description: Evidence identifier.
      schema:
        type: string
        format: uuid
    TransferId:
      name: transferId
      in: path
      required: true
      description: Evidence transfer identifier.
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      description: Report identifier.
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Notification identifier.
      schema:
        type: string
        format: uuid
    AuditLogId:
      name: auditLogId
      in: path
      required: true
      description: Audit-log identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is malformed or violates a business precondition.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing, invalid, expired, or revoked.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal lacks the required RBAC permission or resource scope.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource does not exist or is outside the caller's authorized scope.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The operation conflicts with the current resource state, an idempotency record, or an integrity constraint.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The uploaded request body exceeds the configured limit.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: The supplied media type is not accepted for this operation.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: One or more request fields failed validation.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyRequests:
      description: The applicable rate limit has been exceeded.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
        Retry-After:
          description: Seconds until another request should be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: An unexpected server error occurred.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency such as storage, key management, AI processing, or notification delivery is unavailable.
      headers:
        X-Correlation-ID:
          description: Correlation identifier for tracing this request.
          schema:
            type: string
            format: uuid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: EVIDENCE_INTEGRITY_FAILURE
        message:
          type: string
          example: The evidence hash does not match the trusted hash.
        field:
          type:
          - string
          - 'null'
          example: email
        context:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - success
      - error
      - correlationId
      - timestamp
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    ValidationErrorResponse:
      type: object
      additionalProperties: false
      required:
      - success
      - error
      - validationErrors
      - correlationId
      - timestamp
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ErrorDetail'
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        correlationId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      additionalProperties: false
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
    OperationAccepted:
      type: object
      additionalProperties: false
      required:
      - operationId
      - status
      - submittedAt
      properties:
        operationId:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - PROCESSING
        submittedAt:
          type: string
          format: date-time
    RoleCode:
      type: string
      enum:
      - ADMINISTRATOR
      - SECURITY_OFFICER
      - INVESTIGATOR
      - SECURITY_MANAGER
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - LOCKED
      - DEACTIVATED
      - PENDING_ACTIVATION
    CameraStatus:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      - DEGRADED
      - DISABLED
    IncidentStatus:
      type: string
      enum:
      - NEW
      - CONFIRMED
      - ASSIGNED
      - INVESTIGATING
      - ESCALATED
      - RESOLVED
      - CLOSED
      - FALSE_POSITIVE
      - REOPENED
    Severity:
      type: string
      enum:
      - LOW
      - MEDIUM
      - HIGH
      - CRITICAL
    EvidenceStatus:
      type: string
      enum:
      - PENDING
      - STORED
      - VERIFIED
      - COMPROMISED
      - QUARANTINED
      - ARCHIVED
    CustodyEventType:
      type: string
      enum:
      - ACQUIRED
      - VIEWED
      - TRANSFER_INITIATED
      - TRANSFER_ACCEPTED
      - TRANSFER_REJECTED
      - EXPORTED
      - VERIFIED
      - RETURNED
      - QUARANTINED
    NotificationChannel:
      type: string
      enum:
      - DASHBOARD
      - EMAIL
      - SMS
      - PUSH
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 128
    MfaVerifyRequest:
      type: object
      additionalProperties: false
      required:
      - challengeToken
      - code
      properties:
        challengeToken:
          type: string
          minLength: 20
        code:
          type: string
          pattern: ^[0-9]{6}$
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 20
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type:
          - string
          - 'null'
          minLength: 20
        allSessions:
          type: boolean
          default: false
    RoleSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          $ref: '#/components/schemas/RoleCode'
        description:
          type:
          - string
          - 'null'
    PermissionSummary:
      type: object
      additionalProperties: false
      required:
      - code
      - resource
      - action
      properties:
        code:
          type: string
          example: evidence.verify
        resource:
          type: string
          example: evidence
        action:
          type: string
          example: verify
    CurrentUser:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - username
      - firstName
      - lastName
      - status
      - roles
      - permissions
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        mfaEnabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionSummary'
    TokenPair:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - refreshToken
      - tokenType
      - accessTokenExpiresIn
      - refreshTokenExpiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        accessTokenExpiresIn:
          type: integer
          description: Lifetime in seconds.
        refreshTokenExpiresIn:
          type: integer
          description: Lifetime in seconds.
    AuthResponse:
      type: object
      additionalProperties: false
      required:
      - user
      - tokens
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        tokens:
          $ref: '#/components/schemas/TokenPair'
    MfaChallengeResponse:
      type: object
      additionalProperties: false
      required:
      - mfaRequired
      - challengeToken
      - expiresAt
      properties:
        mfaRequired:
          type: boolean
          const: true
        challengeToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        deliveryHint:
          type:
          - string
          - 'null'
          example: Authenticator application
    UserSummary:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - username
      - firstName
      - lastName
      - status
      - roles
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/UserStatus'
        mfaEnabled:
          type: boolean
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleSummary'
        lastLoginAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserPage:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
    CreateUserRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - username
      - firstName
      - lastName
      - roles
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          minLength: 3
          maxLength: 50
          pattern: ^[A-Za-z0-9._-]+$
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type:
          - string
          - 'null'
          maxLength: 30
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
        sendActivation:
          type: boolean
          default: true
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type:
          - string
          - 'null'
          maxLength: 30
        mfaRequired:
          type: boolean
    AssignRoleRequest:
      type: object
      additionalProperties: false
      required:
      - roleId
      properties:
        roleId:
          type: string
          format: uuid
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    DeactivateUserRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
        reassignOpenIncidentsTo:
          type:
          - string
          - 'null'
          format: uuid
    CredentialResetRequest:
      type: object
      additionalProperties: false
      properties:
        revokeAllSessions:
          type: boolean
          default: true
        deliveryChannel:
          type: string
          enum:
          - EMAIL
          default: EMAIL
    Camera:
      type: object
      additionalProperties: false
      required:
      - id
      - siteId
      - cameraCode
      - name
      - protocol
      - status
      - isActive
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        cameraCode:
          type: string
        name:
          type: string
        ipAddress:
          type:
          - string
          - 'null'
          format: ipv4
        protocol:
          type: string
          enum:
          - RTSP
          - ONVIF
          - HTTPS
        status:
          $ref: '#/components/schemas/CameraStatus'
        locationDescription:
          type:
          - string
          - 'null'
        isActive:
          type: boolean
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CameraPage:
      type: object
      additionalProperties: false
      required:
      - items
      - pagination
      properties:
        items:
          type: array
          items:
