[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-surveillance-ai-engine-addons"
version = "0.1.0"
description = "Independent analysis add-ons for the secure surveillance AI engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.0"]

[project.optional-dependencies]
model = ["ultralytics>=8.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["surveillance_addons*", "integration*"]
